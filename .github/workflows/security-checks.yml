name: Security Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run security audit
      run: |
        npm audit --audit-level=moderate
        if [ $? -ne 0 ]; then
          echo "Security vulnerabilities found. Please fix them before merging."
          exit 1
        fi
    
    - name: Check for secrets
      run: |
        # Check for common secret patterns
        if grep -r "sk_live_" . --exclude-dir=node_modules --exclude-dir=.git; then
          echo "ERROR: Live Stripe secret key found in code"
          exit 1
        fi
        
        if grep -r "eyJ.*\." . --exclude-dir=node_modules --exclude-dir=.git --exclude="*.md"; then
          echo "ERROR: JWT token found in code"
          exit 1
        fi
        
        if grep -r "service_role" . --exclude-dir=node_modules --exclude-dir=.git --exclude="*.md"; then
          echo "ERROR: Service role key found in code"
          exit 1
        fi
    
    - name: Check for test functions in production
      run: |
        # Check for test functions that shouldn't be in production
        if grep -r "list-guards" . --exclude-dir=node_modules --exclude-dir=.git --exclude="*.md" --exclude="*.yml"; then
          echo "WARNING: Test function 'list-guards' found in production code"
        fi
        
        if grep -r "test.*user" . --exclude-dir=node_modules --exclude-dir=.git --exclude="*.md" --exclude="*.yml"; then
          echo "WARNING: Test user references found in production code"
        fi
    
    - name: Check for hardcoded credentials
      run: |
        # Check for hardcoded credentials
        if grep -r "password.*=" . --exclude-dir=node_modules --exclude-dir=.git --exclude="*.md" --exclude="*.yml"; then
          echo "WARNING: Hardcoded password found"
        fi
        
        if grep -r "api.*key.*=" . --exclude-dir=node_modules --exclude-dir=.git --exclude="*.md" --exclude="*.yml"; then
          echo "WARNING: Hardcoded API key found"
        fi

  gitleaks:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dependency-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Check for outdated dependencies
      run: |
        npm outdated || true
        echo "Dependencies check completed"
    
    - name: Check for unused dependencies
      run: |
        npx depcheck || true
        echo "Unused dependencies check completed"

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run ESLint
      run: npm run lint
    
    - name: Run TypeScript check
      run: npm run type-check
    
    - name: Check for console.log statements
      run: |
        if grep -r "console\.log" . --exclude-dir=node_modules --exclude-dir=.git --exclude="*.md" --exclude="*.yml"; then
          echo "WARNING: console.log statements found in production code"
        fi
    
    - name: Check for TODO/FIXME comments
      run: |
        if grep -r "TODO\|FIXME" . --exclude-dir=node_modules --exclude-dir=.git --exclude="*.md" --exclude="*.yml"; then
          echo "WARNING: TODO/FIXME comments found in production code"
        fi




