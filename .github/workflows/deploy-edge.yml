name: Deploy Edge Functions

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: latest
        
    - name: Deploy Edge Functions
      run: |
        # Set up environment
        echo "SUPABASE_ACCESS_TOKEN=${{ secrets.SUPABASE_ACCESS_TOKEN }}" >> $GITHUB_ENV
        echo "SUPABASE_PROJECT_REF=tidzeckbgcyxyzihbdun" >> $GITHUB_ENV
        
        # Deploy functions
        supabase functions deploy --project-ref tidzeckbgcyxyzihbdun
        
    - name: Run migrations
      run: |
        supabase db push --project-ref tidzeckbgcyxyzihbdun
        
    - name: Generate deployment summary
      id: summary
      run: |
        echo "## 🚀 Edge Functions Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Deployed Functions:**" >> $GITHUB_STEP_SUMMARY
        echo "- get-payment-methods" >> $GITHUB_STEP_SUMMARY
        echo "- create-payment-intent" >> $GITHUB_STEP_SUMMARY
        echo "- create-stripe-customer" >> $GITHUB_STEP_SUMMARY
        echo "- emergency-alert" >> $GITHUB_STEP_SUMMARY
        echo "- list-guards" >> $GITHUB_STEP_SUMMARY
        echo "- track-event" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Database Changes:**" >> $GITHUB_STEP_SUMMARY
        echo "- Applied latest migrations" >> $GITHUB_STEP_SUMMARY
        echo "- Refreshed materialized views" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Deployment Time:** $(date)" >> $GITHUB_STEP_SUMMARY
        
    - name: Post deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment successful"
        else
          echo "❌ Deployment failed"
        fi
        
    - name: Notify on failure
      if: failure()
      run: |
        echo "🚨 Edge Functions deployment failed!"
        echo "Please check the logs and retry the deployment."

